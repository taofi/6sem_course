services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: coursedb-p
    environment:
      - ORACLE_PWD=root
    ports:
      - "1521:1521"
      - "5500:5500"
      - "8080:8080"
    volumes:
      - ./oracle/init-scripts:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "oracle-healthcheck"]
      interval: 30s
      retries: 10

  server:
    build: ./server
    container_name: express-server
    depends_on:
      - redis
      - oracle
    environment:
      - BOT_TOKEN=7880611570:AAH-vaArA7ffGHwbcnon4vrSh45lhLcLtTA
      - DB_HOST=oracle
      - DB_PORT=1521
      - DB_USER=adminPDB
      - DB_PASSWORD=oracle
      - DB_NAME=coursePDB
      - DB_DIALECT=oracle
      - DB_CONNECT_STRING=oracle:1521/coursePDB
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CURRENCY_SYMBOL=₽
      
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"

  bot:
    build:
      context: ./bot
    container_name: telegram-bot
    depends_on:
      - redis
      - oracle
    environment:
      - BOT_TOKEN=7880611570:AAH-vaArA7ffGHwbcnon4vrSh45lhLcLtTA
      - DB_HOST=oracle
      - DB_PORT=1521
      - DB_USER=adminPDB
      - DB_PASSWORD=oracle
      - DB_NAME=coursePDB
      - DB_DIALECT=oracle
      - DB_CONNECT_STRING=oracle:1521/coursePDB
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./bot:/app
