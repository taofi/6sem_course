<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers API</title>
    <script>
        const apiUrl = '/api/driver';

        // Получение списка водителей
        async function fetchDrivers() {
            const response = await fetch(apiUrl);
            const drivers = await response.json();
            displayDrivers(drivers);
        }

        // Отображение водителей в таблице
        function displayDrivers(drivers) {
            const tableBody = document.getElementById('driversTableBody');
            tableBody.innerHTML = ''; 
            drivers.forEach(driver => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${driver.driver_id}</td>
                    <td>${driver.name}</td>
                    <td>${driver.last_name}</td>
                    <td>${driver.phone_number}</td>
                    <td>
                        <button onclick="updateDriver(${driver.driver_id})">Update</button>
                        <button onclick="deleteDriver(${driver.driver_id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Создание водителя (POST)
        async function createDriver(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = {
                name: formData.get('name'),
                last_name: formData.get('last_name'),
                phone_number: formData.get('phone_number')
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (response.ok) {
                alert(result.message || 'Водитель добавлен!');
                await fetchDrivers();
                event.target.reset();
            } else {
                alert(result.error || 'Ошибка при добавлении водителя.');
            }
        }

        // Обновление водителя (PUT)
        async function updateDriver(driverId) {
            const newName = prompt("Введите новое имя водителя:");
            const newLastName = prompt("Введите новую фамилию водителя:");
            const newPhoneNumber = prompt("Введите новый номер телефона:");

            const data = {
                driver_id: driverId,
                name: newName,
                last_name: newLastName,
                phone_number: newPhoneNumber
            };

            const response = await fetch(`${apiUrl}/${driverId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (response.ok) {
                alert(result.message || 'Водитель обновлен!');
                await fetchDrivers();
            } else {
                alert(result.error || 'Ошибка при обновлении водителя.');
            }
        }

        // Удаление водителя (DELETE)
        async function deleteDriver(driverId) {
            const confirmDelete = confirm("Вы уверены, что хотите удалить этого водителя?");
            if (confirmDelete) {
                const response = await fetch(`${apiUrl}/${driverId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (response.ok) {
                    alert(result.message || 'Водитель удален!');
                    await fetchDrivers();
                } else {
                    alert(result.error || 'Ошибка при удалении водителя.');
                }
            }
        }

        // Обновление данных
        function refreshData() {
            fetchDrivers();
        }

        window.onload = fetchDrivers;
    </script>
</head>
<body>
    <h1>Управление водителями</h1>
    <form id="driverForm" onsubmit="createDriver(event)">
        <label for="name">Имя:</label>
        <input type="text" name="name" required>
        <label for="last_name">Фамилия:</label>
        <input type="text" name="last_name" required>
        <label for="phone_number">Телефон:</label>
        <input type="text" name="phone_number" required>
        <button type="submit">Добавить водителя</button>
    </form>
    <h2>Список водителей</h2>
    <button onclick="refreshData()">Обновить данные</button>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Телефон</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="driversTableBody">
            <!-- Данные вставляются здесь -->
        </tbody>
    </table>
</body>
</html>
