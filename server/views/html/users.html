<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users API</title>
    <script>
        const apiUrl = '/api/users';

        // Получение списка пользователей
        async function fetchUsers() {
            const response = await fetch(apiUrl);
            const users = await response.json();
            displayUsers(users);
        }

        // Отображение пользователей в таблице
        function displayUsers(users) {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = ''; 
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.user_id}</td>
                    <td>${user.login}</td>
                    <td>${user.role}</td>
                    <td>${user.name}</td>
                    <td>${user.last_name}</td>
                    <td>${user.user_number}</td>
                    <td>
                        <button onclick="updateUser(${user.user_id})">Update</button>
                        <button onclick="deleteUser(${user.user_id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Создание пользователя (POST)
        async function createUser(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = {
                login: formData.get('login'),
                pass: formData.get('pass'),
                role: formData.get('role'),
                name: formData.get('name'),
                last_name: formData.get('last_name'),
                user_number: formData.get('user_number')
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (response.ok) {
                alert(result.message || 'Пользователь добавлен!');
                await fetchUsers();
                event.target.reset();
            } else {
                alert(result.error || 'Ошибка при добавлении пользователя.');
            }
        }

        // Обновление пользователя (PUT)
        async function updateUser(userId) {
            const newLogin = prompt("Введите новый логин:");
            const newPass = prompt("Введите новый пароль:");
            const newRole = prompt("Введите новую роль:");
            const newName = prompt("Введите новое имя:");
            const newLastName = prompt("Введите новую фамилию:");
            const newUserNumber = prompt("Введите новый номер:");

            const data = {
                user_id: userId,
                login: newLogin,
                pass: newPass,
                role: newRole,
                name: newName,
                last_name: newLastName,
                user_number: newUserNumber
            };

            const response = await fetch(`${apiUrl}/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (response.ok) {
                alert(result.message || 'Пользователь обновлен!');
                await fetchUsers();
            } else {
                alert(result.error || 'Ошибка при обновлении пользователя.');
            }
        }

        // Удаление пользователя (DELETE)
        async function deleteUser(userId) {
            const confirmDelete = confirm("Вы уверены, что хотите удалить этого пользователя?");
            if (confirmDelete) {
                const response = await fetch(`${apiUrl}/${userId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (response.ok) {
                    alert(result.message || 'Пользователь удален!');
                    await fetchUsers();
                } else {
                    alert(result.error || 'Ошибка при удалении пользователя.');
                }
            }
        }

        // Обновление данных
        function refreshData() {
            fetchUsers();
        }

        window.onload = fetchUsers;
    </script>
</head>
<body>
    <h1>Управление пользователями</h1>
    <form id="userForm" onsubmit="createUser(event)">
        <label for="login">Логин:</label>
        <input type="text" name="login" required>
        <label for="pass">Пароль:</label>
        <input type="password" name="pass" required>
        <label for="role">Роль:</label>
        <input type="text" name="role" required>
        <label for="name">Имя:</label>
        <input type="text" name="name" required>
        <label for="last_name">Фамилия:</label>
        <input type="text" name="last_name" required>
        <label for="user_number">Номер телефона:</label>
        <input type="text" name="user_number" required>
        <button type="submit">Добавить пользователя</button>
    </form>
    <h2>Список пользователей</h2>
    <button onclick="refreshData()">Обновить данные</button>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Роль</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Номер телефона</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <!-- Данные вставляются здесь -->
        </tbody>
    </table>
</body>
</html>
